# Fly.io — API + worker in ONE app, two processes off ONE image.
#   fly launch --no-deploy --copy-config --name <your-app>
#   ./web/deploy-fly.sh          # pushes secrets from web/backend/.env, then deploys
#
# `web`    -> uvicorn (HTTP, public)
# `worker` -> APScheduler loop (no service, always on)
app = "alpaca-options-saas"
primary_region = "sjc"          # us-west, matches the Supabase project region

[build]
  dockerfile = "web/backend/Dockerfile"
  # build context is the repo root (where this fly.toml lives)

[processes]
  web = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker = "python worker.py"

# Note: per-user iv_history.jsonl / fallback journal write to ./logs and are
# ephemeral (reset on each deploy). The DB (Supabase) is the durable store;
# iv-rank proxy rebuilds on its own. Add a Fly volume + AGENT_LOG_ROOT only if
# you want that history to persist.

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"     # API must not sleep
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"               # alpaca-py + numpy/pandas/scipy need headroom
  processes = ["web", "worker"]
